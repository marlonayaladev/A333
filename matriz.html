<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Matriz 3x2</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #ecf0f1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #root {
      text-align: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }
    .fila {
      display: flex;
      justify-content: center;
    }
    .celda {
      width: 100px;
      height: 100px;
      margin: 5px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #3498db;
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    function App() {
      const matriz = [
        [1, 2],
        [3, 4],
        [5, 6],
      ];

      return (
        <div>
          <h1>Matriz 3x2</h1>
          {matriz.map((fila, i) => (
            <div className="fila" key={i}>
              {fila.map((num) => (
                <div className="celda" key={num}>{num}</div>
              ))}
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
